name: Build release binaries

# Ikkala tomonni ham (Windows .exe va Android .apk) haqiqiy tarmoqqa
# ulanish huquqiga ega GitHub-hosted runnerlarda quradi (Microsoft'ning
# .NET va Google'ning Android Maven repozitoriylariga ulanish kerak -
# bular ba'zi cheklangan (sandboxed) muhitlarda bloklangan bo'lishi
# mumkin, shuning uchun build har doim shu yerda, CI'da bajariladi).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained win-x64 .exe
        run: >
          dotnet publish desktop/PrezenterServer/PrezenterServer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/windows

      - name: Rename artifact
        run: Copy-Item publish/windows/PrezenterServer.exe publish/windows/Prezenter-Server-Windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: prezenter-server-windows
          path: publish/windows/Prezenter-Server-Windows-x64.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ubuntu-latest runnerlarida Android SDK oldindan o'rnatilgan bo'ladi
      # (ANDROID_HOME orqali) - alohida setup-android action shart emas,
      # faqat kerakli platform/build-tools mavjudligini ta'minlaymiz.
      - name: Ensure required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Prezenter-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: prezenter-android
          path: android/app/build/outputs/apk/debug/Prezenter-Android.apk

  release:
    needs: [build-windows, build-android]
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=latest-build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Prezenter - ${{ steps.tag.outputs.tag_name }}"
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
          files: |
            artifacts/prezenter-server-windows/Prezenter-Server-Windows-x64.exe
            artifacts/prezenter-android/Prezenter-Android.apk
